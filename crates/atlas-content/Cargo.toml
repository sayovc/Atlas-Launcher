[package]
name = "atlas-content"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atlas-downloads = { version = "0.1.0", path = "../atlas-downloads" }
atlas-shared = { version = "0.1.0", path = "../atlas-shared" }
base64 = "0.23.1"
flate2 = "1.1.11"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "macros", "rt"] }
toml = "1.2.1"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
atlas-downloads = { path = "../atlas-downloads", features = ["testing"] }
sha2 = "0.11"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
