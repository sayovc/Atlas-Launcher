[package]
name = "atlas-logging"
version = "0.1.0"
edition = "2024"

[dependencies]
atlas-shared = { version = "0.1.0", path = "../atlas-shared" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = "0.3.55"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "time", "json"] }

[dev-dependencies]
tempfile = "3.27.0"
