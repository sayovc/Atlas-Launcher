[package]
name = "atlas-versions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atlas-downloads = { version = "0.1.0", path = "../atlas-downloads" }
atlas-shared = { version = "0.1.0", path = "../atlas-shared" }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
toml = "1.2.1"
tracing = "0.1.44"
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
atlas-downloads = { path = "../atlas-downloads", features = ["testing"] }
tempfile = "3.27.0"
