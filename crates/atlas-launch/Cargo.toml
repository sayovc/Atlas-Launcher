[package]
name = "atlas-launch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atlas-shared = { version = "0.1.0", path = "../atlas-shared" }
atlas-versions = { version = "0.1.0", path = "../atlas-versions" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "io-util", "rt", "macros", "time", "sync"] }
tracing = "0.1.44"
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
