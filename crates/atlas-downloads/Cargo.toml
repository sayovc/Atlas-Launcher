[package]
name = "atlas-downloads"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atlas-shared = { version = "0.1.0", path = "../atlas-shared" }
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "http2", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[features]
testing = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
