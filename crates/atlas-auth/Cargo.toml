[package]
name = "atlas-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atlas-shared = { version = "0.1.0", path = "../atlas-shared" }
base64 = "0.23.1"
hex = "0.4.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "macros", "rt", "sync"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
