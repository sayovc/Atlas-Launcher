[package]
name = "atlas-cli"
description = "Atlas Launcher command-line interface"
version = "0.1.0"
edition = "2024"

[dependencies]
atlas-config = { version = "0.1.0", path = "../atlas-config" }
atlas-core = { version = "0.1.0", path = "../atlas-core" }
atlas-logging = { version = "0.1.0", path = "../atlas-logging" }
atlas-shared = { version = "0.1.0", path = "../atlas-shared" }
clap = { version = "4.6.7", features = ["derive"] }
serde = "1.0.229"
serde_json = "1.0.154"
tracing = "0.1.44"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "atlas"
path = "src/main.rs"

[lints]
workspace = true
