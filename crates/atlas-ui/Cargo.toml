[package]
name = "atlas-ui"
description = "Atlas Launcher desktop interface"
version = "0.1.0"
edition = "2024"

[dependencies]
atlas-config = { version = "0.1.0", path = "../atlas-config" }
atlas-core = { version = "0.1.0", path = "../atlas-core" }
atlas-logging = { version = "0.1.0", path = "../atlas-logging" }
atlas-mcp = { version = "0.1.0", path = "../atlas-mcp" }
atlas-shared = { version = "0.1.0", path = "../atlas-shared" }
base64 = "0.23.1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.37.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rfd = "0.18.0"
tracing = "0.1.44"

[[bin]]
name = "atlas-launcher"
path = "src/main.rs"

[lints]
workspace = true

[package.metadata.packager]
product-name = "Atlas Launcher"
identifier = "dev.atlaslauncher.app"
category = "Game"
description = "Modded Minecraft in one click. Not affiliated with Mojang or Microsoft."
homepage = "https://sayovc.github.io/Atlas-Launcher/"
authors = ["Sayo"]
publisher = "Atlas Launcher"
license-file = "../../LICENSE"
out-dir = "../../dist"
before-packaging-command = "cargo build --release -p atlas-ui -p atlas-cli"
binaries = [
  { path = "atlas-launcher", main = true },
  { path = "atlas", main = false },
]
icons = [
  "../../packaging/icons/32x32.png",
  "../../packaging/icons/128x128.png",
  "../../packaging/icons/256x256.png",
  "../../packaging/icons/512x512.png",
  "../../packaging/icons/icon.ico",
]

[package.metadata.packager.deb]
section = "games"

[package.metadata.packager.nsis]
installer-mode = "currentUser"

[package.metadata.packager.macos]
minimum-system-version = "12.0"
