[package]
name = "atlas-core"
version = "0.1.0"
edition = "2024"

[dependencies]
atlas-config = { version = "0.1.0", path = "../atlas-config" }
atlas-downloads = { version = "0.1.0", path = "../atlas-downloads" }
atlas-logging = { version = "0.1.0", path = "../atlas-logging" }
atlas-shared = { version = "0.1.0", path = "../atlas-shared" }
atlas-versions = { version = "0.1.0", path = "../atlas-versions" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
toml = "1.2.1"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
