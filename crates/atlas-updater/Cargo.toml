[package]
name = "atlas-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atlas-downloads = { version = "0.1.0", path = "../atlas-downloads" }
atlas-shared = { version = "0.1.0", path = "../atlas-shared" }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
atlas-downloads = { path = "../atlas-downloads", features = ["testing"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
