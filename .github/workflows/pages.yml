name: Website

# Publishes site/ to the gh-pages branch, which GitHub Pages serves at
# https://sayovc.github.io/Atlas-Launcher/
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push site/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SPLIT=$(git subtree split --prefix site HEAD)
          git push --force origin "$SPLIT:refs/heads/gh-pages"
