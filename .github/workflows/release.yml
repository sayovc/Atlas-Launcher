name: Release

# Push a tag like v0.2.0 to build and publish a release.
# Optional repo settings:
#   variable ATLAS_MS_CLIENT_ID   - Azure app id for Microsoft sign-in
#   variable ATLAS_UPDATE_PUBKEY  - public half of the update key (cargo xtask keygen)
#   secret   ATLAS_UPDATE_KEY     - private half, used to sign atlas-update.json
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ATLAS_MS_CLIENT_ID: ${{ vars.ATLAS_MS_CLIENT_ID }}
  ATLAS_UPDATE_PUBKEY: ${{ vars.ATLAS_UPDATE_PUBKEY }}

jobs:
  build:
    name: Build (${{ matrix.key }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, key: x86_64-linux, exe: "" }
          - { os: windows-latest, key: x86_64-windows, exe: ".exe" }
          - { os: macos-latest, key: aarch64-macos, exe: "" }
          - { os: macos-15-intel, key: x86_64-macos, exe: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libgtk-3-dev libfuse2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Build installers
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows) formats=nsis ;;
            macOS) formats=app,dmg ;;
            *) formats=deb,appimage ;;
          esac
          cargo packager --release -p atlas-ui --formats "$formats"
      - name: Collect files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # raw binary for the self-updater, named <arch>-<os>
          cp target/release/atlas-launcher${{ matrix.exe }} "out/atlas-launcher-${{ matrix.key }}${{ matrix.exe }}"
          find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} out/ \;
          if [ "${{ runner.os }}" = "macOS" ]; then
            (cd dist && zip -qry "../out/AtlasLauncher-${{ github.ref_name }}-${{ matrix.key }}.app.zip" "Atlas Launcher.app")
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.key }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and signed update manifest
        env:
          ATLAS_UPDATE_KEY: ${{ secrets.ATLAS_UPDATE_KEY }}
        run: |
          set -euo pipefail
          cargo xtask manifest --version "${GITHUB_REF_NAME}" --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" dist
          if [ -n "${ATLAS_UPDATE_KEY}" ]; then
            cargo xtask sign dist/atlas-update.json
          else
            echo "::warning::ATLAS_UPDATE_KEY not set; publishing without a signed update manifest (auto-update stays off)"
            rm dist/atlas-update.json
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Atlas Launcher ${GITHUB_REF_NAME}" --generate-notes --prerelease
