name: Release

# Push a tag like v0.2.0 to build and publish a release.
# Optional repo settings:
#   variable ATLAS_MS_CLIENT_ID   - Azure app id for Microsoft sign-in
#   variable ATLAS_UPDATE_PUBKEY  - public half of the update key (cargo xtask keygen)
#   secret   ATLAS_UPDATE_KEY     - private half, used to sign atlas-update.json
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ATLAS_MS_CLIENT_ID: ${{ vars.ATLAS_MS_CLIENT_ID }}
  ATLAS_UPDATE_PUBKEY: ${{ vars.ATLAS_UPDATE_PUBKEY }}

jobs:
  build:
    name: Build (${{ matrix.key }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, key: x86_64-linux, exe: "" }
          - { os: windows-latest, key: x86_64-windows, exe: ".exe" }
          - { os: macos-latest, key: aarch64-macos, exe: "" }
          - { os: macos-15-intel, key: x86_64-macos, exe: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libgtk-3-dev
      - name: Build
        run: cargo build --release -p atlas-ui -p atlas-cli
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist pkg
          cp target/release/atlas-launcher${{ matrix.exe }} dist/atlas-launcher-${{ matrix.key }}${{ matrix.exe }}
          cp target/release/atlas-launcher${{ matrix.exe }} target/release/atlas${{ matrix.exe }} README.md LICENSE pkg/
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/AtlasLauncher-${{ github.ref_name }}-${{ matrix.key }}.zip" ./pkg/*
          elif [ "${{ runner.os }}" = "macOS" ]; then
            app="pkg/Atlas Launcher.app/Contents"
            mkdir -p "$app/MacOS"
            cp target/release/atlas-launcher "$app/MacOS/"
            cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Atlas Launcher</string>
            <key>CFBundleIdentifier</key><string>dev.atlaslauncher.app</string>
            <key>CFBundleExecutable</key><string>atlas-launcher</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
            (cd pkg && zip -qry "../dist/AtlasLauncher-${{ github.ref_name }}-${{ matrix.key }}.zip" .)
          else
            tar -czf "dist/AtlasLauncher-${{ github.ref_name }}-${{ matrix.key }}.tar.gz" -C pkg .
            cargo install cargo-deb --locked
            cargo deb -p atlas-ui --no-build --output dist/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.key }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and signed update manifest
        env:
          ATLAS_UPDATE_KEY: ${{ secrets.ATLAS_UPDATE_KEY }}
        run: |
          set -euo pipefail
          cargo xtask manifest --version "${GITHUB_REF_NAME}" --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" dist
          if [ -n "${ATLAS_UPDATE_KEY}" ]; then
            cargo xtask sign dist/atlas-update.json
          else
            echo "::warning::ATLAS_UPDATE_KEY not set; publishing without a signed update manifest (auto-update stays off)"
            rm dist/atlas-update.json
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Atlas Launcher ${GITHUB_REF_NAME}" --generate-notes --prerelease
